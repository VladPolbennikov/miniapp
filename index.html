<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mini App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <img src="logo.jpg" alt="Bot logo" class="app-logo" />
      <div class="app-header-text">
        <h1 class="app-title">Pamela English Tutor</h1>
        <p class="app-subtitle">Главные настройки и меню бота</p>
      </div>
    </header>

    <main class="actions">
      <section class="action">
        <button class="btn btn-primary" type="button" id="btn-stats" aria-label="Моя статистика">
          <span class="btn-icon">📊</span>
          <span class="btn-text">Моя статистика обучения</span>
        </button>
      </section>

      <section class="action">
        <button class="btn btn-neutral" type="button" id="btn-speed" aria-label="Скорость речи">
          <span class="btn-icon">⏱️</span>
          <span class="btn-text">Скорость речи бота</span>
        </button>
      </section>

      <section class="action">
        <button class="btn btn-neutral" type="button" id="btn-voice" aria-label="Выбор голоса">
          <span class="btn-icon">🎙️</span>
          <span class="btn-text">Изменить озвучку голоса</span>
        </button>
      </section>

      <section class="action">
        <button class="btn btn-premium" type="button" id="btn-premium" aria-label="Премиум">
          <span class="btn-icon">⭐</span>
          <span class="btn-text">Купить премиум подписку</span>
        </button>
        <div class="hint">Больше возможностей с подпиской</div>
      </section>

      <section class="action">
        <button class="btn btn-neutral" type="button" id="btn-support" aria-label="Поддержка">
          <span class="btn-icon">💬</span>
          <span class="btn-text">Поддержка и рекомендации</span>
        </button>
      </section>
    </main>
  </div>

  <script>
      const tg = window.Telegram.WebApp;
      tg.ready();

      // HTTP эндпоинт вашего бота (как в оригинале)
      const ENDPOINT = "https://bot.pamelaenglishbot.ru/";

      // Универсальная функция отправки команд (основана на оригинальной sendPremium)
      async function sendCommand(command) {
        try {
          const queryId = tg?.initDataUnsafe?.query_id;
          if (!queryId) {
            console.log("query_id недоступен (Mini App должен быть запущен из меню/вложений).");
            return;
          }

          const resp = await fetch(ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query_id: queryId, command: command }),
          });

          const data = await resp.json();
          if (!data.ok) {
            console.error("Server error:", data);
            return;
          }

          tg.close();
        } catch (e) {
          console.error(e);
        }
      }

      // Добавляем обработчики для всех кнопок
      document.getElementById("btn-stats").addEventListener("click", () => sendCommand("stats"));
      document.getElementById("btn-speed").addEventListener("click", () => sendCommand("speed"));
      document.getElementById("btn-voice").addEventListener("click", () => sendCommand("voice"));
      document.getElementById("btn-premium").addEventListener("click", () => sendCommand("premium"));
      document.getElementById("btn-support").addEventListener("click", () => sendCommand("help"));
    </script>
</body>
</html>
